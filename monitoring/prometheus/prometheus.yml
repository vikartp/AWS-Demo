# Prometheus scrape configuration for DocuMind
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  # BFF metrics
  - job_name: 'bff'
    static_configs:
      - targets: ['bff:3000']
    metrics_path: '/metrics'

  # Backend metrics
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/metrics'

  # Worker metrics
  - job_name: 'worker'
    static_configs:
      - targets: ['worker:3004']
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
