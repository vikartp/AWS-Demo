# ============================================
# DocuMind - Local Development Environment
# ============================================
# Start with: docker-compose up --build
# Stop with:  docker-compose down
# Reset data: docker-compose down -v
# ============================================

services:
  # ---- Frontend ----
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/index.html:/app/packages/frontend/index.html
    environment:
      - NODE_ENV=development
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - documind-net

  # ---- BFF (Backend-for-Frontend) ----
  bff:
    build:
      context: .
      dockerfile: packages/bff/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CORS_ORIGIN=http://localhost:5173
      - BACKEND_URL=http://backend:3001
      - AUTH_PROVIDER=local
      - JWT_SECRET=local-dev-secret-do-not-use-in-production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - documind-net

  # ---- Backend API ----
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGODB_URI=mongodb://mongo:27017/documind
      - CORS_ORIGIN=http://localhost:5173
      - AI_SERVICE_URL=http://mock-ai:3003
      - AI_PROVIDER=mock
      - STORAGE_PROVIDER=local
      - UPLOAD_DIR=/app/uploads
      - QUEUE_PROVIDER=local
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      mock-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - documind-net

  # ---- Background Worker ----
  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - MONGODB_URI=mongodb://mongo:27017/documind
      - AI_SERVICE_URL=http://mock-ai:3003
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - documind-net

  # ---- Mock AI Service (NOT Bedrock) ----
  mock-ai:
    build:
      context: .
      dockerfile: packages/mock-ai/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - documind-net

  # ---- MongoDB ----
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - documind-net

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:v2.54.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    depends_on:
      - bff
      - backend
      - worker
    networks:
      - documind-net

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=documind
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - documind-net

# ---- Volumes ----
volumes:
  mongo-data:
    name: documind-mongo-data
  prometheus-data:
    name: documind-prometheus-data
  grafana-data:
    name: documind-grafana-data
  uploads:
    name: documind-uploads

# ---- Networks ----
networks:
  documind-net:
    name: documind-network
    driver: bridge
